 return {
  users:[{id:'guru',username:'guru',name:'Guru IPS',cls:'',role:'teacher',pass:'guru123'}],
  progress:{}, attempts:[], simres:[], logs:[],
  videos:{A:'https://youtu.be/NMbO2s3-g5k',B:'https://youtu.be/Xo8vib9TGyM',C:'https://youtu.be/R3l8qBHvK6A'},
  titles:{A:'Keragaman Aktivitas Ekonomi Masyarakat',B:'Mobilitas Sosial',C:'Interaksi Budaya pada Masa Kerajaan Islam'},
  summaries:{A:'Pengaruh kondisi geografis terhadap mata pencaharian, pemanfaatan lingkungan, dan perdagangan antarpulau.',B:'Dinamika penduduk, keragaman masyarakat, dan perpindahan posisi sosial di Indonesia.',C:'Perkembangan, penyebaran, dan wujud akulturasi budaya Islam di Indonesia.'},
  materials:[
   {id:uid(),sub:'A',title:'Bagaimana proses geografis memengaruhi aktivitas ekonomi?',content:`Letak, iklim, relief, dan kesuburan tanah membuat setiap daerah di Indonesia memiliki cara mencari nafkah yang berbeda.\n\n- Daerah pesisir dan kepulauan: nelayan, budidaya rumput laut, pembuat garam, pariwisata bahari.\n- Dataran rendah subur: pertanian padi dan palawija, contohnya di Pantura Jawa.\n- Dataran tinggi dan pegunungan: perkebunan teh, kopi, sayuran, dan wisata alam, contohnya di Dieng.\n- Daerah kaya tambang: pertambangan, contohnya timah di Bangka Belitung dan nikel di Sulawesi.\n\nIndonesia beriklim tropis dengan dua musim. Musim hujan dan kemarau memengaruhi waktu tanam, panen, dan hasil tangkapan ikan. Letusan gunung api juga menyuburkan tanah sehingga daerah sekitarnya cocok untuk bertani.\n\nRangkuman: kondisi geografis menentukan sumber daya yang tersedia, dan sumber daya itu membentuk jenis pekerjaan masyarakat setempat.`},
   {id:uid(),sub:'A',title:'Bagaimana pemanfaatan lingkungan sekitar dalam pemenuhan kebutuhan ekonomi?',content:`Masyarakat memanfaatkan lingkungan untuk memenuhi kebutuhan hidup, dari yang sederhana sampai berskala industri.\n\n- Tanah dan lahan: bertani, berkebun, beternak.\n- Laut dan sungai: menangkap ikan, tambak, keramba.\n- Hutan: hasil hutan seperti rotan, madu, dan getah dengan cara lestari.\n- Bentang alam dan budaya: pariwisata dan kerajinan lokal.\n\nPemanfaatan harus berkelanjutan. Penebangan liar atau penangkapan ikan dengan bom merusak lingkungan dan merugikan generasi berikutnya.\n\nContoh sehari-hari: pedagang di pasar menjual hasil tani dari desa sekitar, dan sebagian masyarakat membuat kerajinan dari bahan alam setempat.\n\nRangkuman: lingkungan adalah modal ekonomi; kita harus memanfaatkannya secara bijak agar tetap lestari.`},
   {id:uid(),sub:'A',title:'Bagaimana perdagangan antarpulau dapat terjadi di Indonesia?',content:`Tiap pulau menghasilkan barang yang berbeda sehingga terjadi saling ketergantungan.\n\n- Jawa: padi, industri, barang manufaktur.\n- Sumatra: kelapa sawit, karet, batu bara.\n- Kalimantan: batu bara, kayu, kelapa sawit.\n- Sulawesi: nikel, kakao, cengkih.\n- Maluku: rempah-rempah seperti pala dan cengkih.\n\nPerdagangan antarpulau terjadi karena perbedaan sumber daya, kebutuhan, dan keahlian. Pelabuhan, kapal, tol laut, bandara, dan jalan menjadi sarana penghubungnya. Sejak masa lampau, Nusantara dikenal sebagai jalur perdagangan rempah.\n\nManfaatnya: pemerataan barang, terbukanya lapangan kerja, dan persatuan antardaerah. Tantangannya: biaya angkut mahal dan infrastruktur belum merata.\n\nRangkuman: perbedaan hasil daerah mendorong perdagangan antarpulau yang memperkuat ekonomi dan persatuan.`},
   {id:uid(),sub:'B',title:'Bagaimana dinamika kependudukan di Indonesia?',content:`Dinamika penduduk adalah perubahan jumlah, persebaran, dan komposisi penduduk.\n\n- Penambah: kelahiran (natalitas) dan migrasi masuk.\n- Pengurang: kematian (mortalitas) dan migrasi keluar.\n- Persebaran tidak merata: sekitar separuh penduduk Indonesia tinggal di Pulau Jawa.\n- Urbanisasi: perpindahan penduduk dari desa ke kota untuk mencari pekerjaan dan pendidikan.\n\nDampak positif: tenaga kerja dan pasar yang besar. Dampak negatif: kepadatan, pengangguran, permukiman kumuh, dan kemacetan. Pemerintah menempuh program Keluarga Berencana dan pemerataan pembangunan.\n\nRangkuman: jumlah dan persebaran penduduk terus berubah dan perlu dikelola agar menjadi kekuatan pembangunan.`},
   {id:uid(),sub:'B',title:'Bagaimana bentuk keragaman masyarakat Indonesia?',content:`Masyarakat Indonesia majemuk: terdiri dari banyak suku, agama, ras, bahasa, dan budaya.\n\n- Keragaman suku dan budaya: ratusan kelompok etnik dengan adat dan bahasa daerah.\n- Keragaman agama: Islam, Kristen, Katolik, Hindu, Buddha, Konghucu, dan penghayat kepercayaan.\n- Keragaman sosial dan ekonomi: perbedaan pekerjaan, pendidikan, dan pendapatan.\n\nPenyebabnya antara lain kondisi geografis kepulauan, pengaruh budaya asing, dan perbedaan iklim. Semboyan Bhinneka Tunggal Ika menjadi pemersatu. Sikap yang perlu dikembangkan: toleransi, gotong royong, dan saling menghargai.\n\nRangkuman: keragaman adalah kekayaan bangsa yang harus dijaga dengan toleransi.`},
   {id:uid(),sub:'B',title:'Bagaimana proses mobilitas sosial di Indonesia?',content:`Mobilitas sosial adalah perpindahan seseorang atau kelompok dari satu lapisan sosial ke lapisan lain.\n\n- Vertikal naik: buruh tani menjadi pemilik usaha setelah sekolah dan bekerja keras.\n- Vertikal turun: pengusaha bangkrut sehingga status ekonominya menurun.\n- Horizontal: berpindah pekerjaan tanpa perubahan status, misalnya pindah ke pekerjaan lain dengan penghasilan setara.\n\nSaluran mobilitas: pendidikan, pekerjaan, organisasi, dan perkawinan. Pendorong: pendidikan, keterampilan, dan kesempatan. Penghambat: kemiskinan, diskriminasi, dan keterbatasan akses.\n\nRangkuman: pendidikan adalah saluran mobilitas sosial yang paling kuat bagi pelajar.`},
   {id:uid(),sub:'C',title:'Bagaimana perkembangan agama dan kebudayaan Islam di Indonesia?',content:`Islam masuk ke Nusantara melalui jalur perdagangan sejak sekitar abad ke-7 sampai ke-13. Pedagang dari Arab, Persia, dan Gujarat singgah di pelabuhan seperti Samudra Pasai.\n\n- Kerajaan Islam: Samudra Pasai, Aceh Darussalam, Demak, Mataram Islam, Banten, Cirebon, Gowa-Tallo, Ternate dan Tidore.\n- Kerajaan menjadi pusat politik, perdagangan, dan penyebaran ilmu agama.\n- Peninggalan: masjid, makam, naskah, dan karya sastra.\n\nRangkuman: perkembangan Islam terjadi seiring tumbuhnya kerajaan-kerajaan Islam di berbagai wilayah Nusantara.`},
   {id:uid(),sub:'C',title:'Bagaimana cara penyebaran agama Islam di Indonesia?',content:`Islam menyebar secara damai melalui beberapa saluran.\n\n- Perdagangan: pedagang muslim berinteraksi dengan penduduk di pelabuhan.\n- Perkawinan: pedagang menikah dengan penduduk setempat sehingga terbentuk keluarga muslim.\n- Pendidikan: pesantren dan surau menjadi pusat belajar.\n- Tasawuf: ajaran yang mudah diterima masyarakat.\n- Kesenian: wayang, gamelan, dan tembang menjadi media dakwah, terutama oleh Wali Songo.\n- Politik: raja yang masuk Islam diikuti rakyatnya.\n\nRangkuman: Islam tersebar secara damai melalui perdagangan, perkawinan, pendidikan, tasawuf, kesenian, dan politik.`},
   {id:uid(),sub:'C',title:'Bagaimana bentuk interaksi budaya pengaruh Islam di Indonesia?',content:`Interaksi budaya melahirkan akulturasi, yaitu perpaduan budaya lokal dengan budaya Islam tanpa menghilangkan ciri aslinya.\n\n- Seni bangunan: Masjid Agung Demak beratap tumpang, Menara Kudus yang mirip candi.\n- Seni rupa: kaligrafi dan ragam hias.\n- Sastra: hikayat dan syair, misalnya Hikayat Raja-Raja Pasai.\n- Kesenian: wayang dengan cerita bernuansa Islam.\n- Tradisi: kalender Hijriah berdampingan dengan kalender Jawa, tradisi sekaten dan grebeg.\n\nRangkuman: budaya Islam berpadu dengan budaya setempat dan memperkaya kebudayaan Indonesia.`}

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{const s=localStorage.getItem('ips8_db');if(s)return JSON.parse(s)}catch(e){}return seed()}
let DB=load();
function save(){try{localStorage.setItem('ips8_db',JSON.stringify(DB))}catch(e){alert('Penyimpanan penuh/ditolak peramban: '+e.message)}}
save();
const fmt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'medium'});
function log(type,sub,meta){DB.logs.push({id:uid(),uid:S.user.id,t:new Date().toISOString(),type,sub:sub||'',meta:meta||{}});save()}
function P(u,sub){DB.progress[u]=DB.progress[u]||{};return DB.progress[u][sub]=DB.progress[u][sub]||{m:false,v:false,s:false,p:false}}
function unlocked(u,sub){return sub==='A'||P(u,sub==='B'?'A':'B').p}
const att=(u,sub)=>DB.attempts.filter(a=>a.uid===u&&a.sub===sub).sort((a,b)=>a.no-b.no);
const students=()=>DB.users.filter(u=>u.role==='student');
const userOf=id=>DB.users.find(u=>u.id===id)||{name:'?',cls:''};

/* ===================== PENILAIAN ===================== */
function grade(q,a){
 if(a===undefined||a===null)return 0;
 if(q.type==='pg')return a===q.key?1:0;
 if(q.type==='pgk'){const x=[...(a||[])].sort().join(),y=[...q.key].sort().join();return x===y?1:0}
 const keys=Object.keys(q.key);let ok=0;
 keys.forEach(k=>{if(q.type==='tf'?(a||{})[k]===q.key[k]:(a||{})[k]===q.key[k])ok++});
 return keys.length?ok/keys.length:0;
}
function submitQuiz(){
 if(!confirm('Kirim jawaban? Setiap pengiriman dicatat sebagai satu percobaan.'))return;
 const Z=S.quiz,qs=Z.qs;let sw=0,sg=0;
 const graded=qs.map(q=>{const f=grade(q,Z.ans[q.id]),pts=f*q.weight;sw+=q.weight;sg+=pts;return{prompt:q.prompt,type:q.type,level:q.difficulty,weight:q.weight,fraction:f,points:pts,given:Z.ans[q.id]??null,key:q.key}});
 const score=Math.round(10000*sg/sw)/100,status=score>=KKM?'TUNTAS':'BELUM TUNTAS';
 const rec={id:uid(),uid:S.user.id,sub:Z.sub,no:att(S.user.id,Z.sub).length+1,score,status,t0:Z.t0,t:new Date().toISOString(),answers:JSON.parse(JSON.stringify(Z.ans)),graded};
 DB.attempts.push(rec);                 // hanya menambah; tidak ada fungsi yang mengubah/menghapus percobaan
 if(status==='TUNTAS')P(S.user.id,Z.sub).p=true;
 save();log('submit_assessment',Z.sub,{percobaan:rec.no,nilai:score,status});
 S.result=rec;S.quiz=null;render();
}

function doLogin(){
 const u=DB.users.find(x=>x.username===v('lu').trim().toLowerCase()&&x.pass===v('lp'));
 if(!u){S.msg='Nama pengguna atau kata sandi salah';return render()}
 S.user=u;S.msg='';S.sub=null;S.gtab=0;if(u.role==='student')log('login');render();
}
function doReg(){
 const un=v('ru').trim().toLowerCase(),nm=v('rn').trim(),pw=v('rp');
 if(!un||!nm||pw.length<4){S.msg='Isi semua kolom (kata sandi min. 4 karakter)';return render()}
 if(DB.users.some(x=>x.username===un)){S.msg='Nama pengguna sudah dipakai';return render()}
 const u={id:uid(),username:un,name:nm,cls:v('rc').trim(),role:'student',pass:pw};
 DB.users.push(u);save();S.user=u;S.msg='';log('login');render();
}
function logout(){if(S.user.role==='student')log('logout');S.user=null;S.sub=null;S.quiz=null;S.result=null;render()}
function v(id){const e=document.getElementById(id);return e?e.value:''}
function openSub(id){if(!unlocked(S.user.id,id))return alert('Subbab masih terkunci. Tuntaskan subbab sebelumnya.');S.sub=id;S.tab='materi';S.quiz=null;S.result=null;S.simRes=null;S.simAns={};render()}
function setTab(t){S.tab=t;S.quiz=null;S.result=null;if(t==='sim'){S.simRes=null;S.simAns={};log('open_simulation',S.sub)}render()}
function readDone(){const p=P(S.user.id,S.sub);if(!p.m){p.m=true;log('open_material',S.sub)}save();S.tab='video';render()}
function videoDone(){const p=P(S.user.id,S.sub);if(!p.v){p.v=true;log('watch_video',S.sub);save();render()}}
function simAns(i,val){S.simAns[i]=val===''?undefined:+val;render()}
function simSubmit(){
 const s=DB.sims[S.sub];let ok=0;s.items.forEach((it,i)=>{if(S.simAns[i]===it[1])ok++});
 const score=Math.round(10000*ok/s.items.length)/100;
 DB.simres.push({id:uid(),uid:S.user.id,sub:S.sub,score,answers:{...S.simAns},t:new Date().toISOString()});
 P(S.user.id,S.sub).s=true;save();log('finish_simulation',S.sub,{skor:score});S.simRes={ok,score};render();
}
function startQuiz(){
 const p=P(S.user.id,S.sub);if(!(p.m&&p.v&&p.s))return alert('Selesaikan materi, video, dan simulasi dahulu');
 const qs=DB.questions.filter(q=>q.sub===S.sub&&q.active).sort((a,b)=>Object.keys(LVL).indexOf(a.difficulty)-Object.keys(LVL).indexOf(b.difficulty));
 if(!qs.length)return alert('Belum ada soal aktif');
 log(att(S.user.id,S.sub).length?'retry_assessment':'start_assessment',S.sub);
 S.quiz={sub:S.sub,qs,ans:{},t0:new Date().toISOString()};S.result=null;render();
}
function aPg(q,o){S.quiz.ans[q]=o;render()}
function aPgk(q,o){const a=S.quiz.ans[q]||[];S.quiz.ans[q]=a.includes(o)?a.filter(x=>x!==o):[...a,o];render()}
function aMap(q,k,val){const a=S.quiz.ans[q]||{};a[k]=val===''?undefined:(val==='true'?true:val==='false'?false:val);S.quiz.ans[q]=a;render()}

function mdText(t){return t.split('\n\n').map(b=>{const L=b.split('\n');if(L.every(l=>l.startsWith('- ')))return '<ul>'+L.map(l=>`<li>${esc(l.slice(2))}</li>`).join('')+'</ul>';return `<p class="${b.startsWith('Rangkuman:')?'sum':''}">${esc(b)}</p>`}).join('')}

function vSub(){
 const s=S.sub,p=P(S.user.id,s);
 const tab=(k,l,dis)=>`<button class="${S.tab===k?'on':''}" ${dis?'disabled':''} onclick="setTab('${k}')">${l}</button>`;
 let body='';
 if(S.tab==='materi'){
  body=DB.materials.filter(m=>m.sub===s).map((m,i)=>`<section><h3>${i+1}. ${esc(m.title)}</h3>${mdText(m.content)}</section>`).join('')+`<button class="btn" onclick="readDone()">${p.m?'Lanjut ke Video →':'Saya sudah membaca, lanjut ke Video'}</button>`;
 }else if(S.tab==='video'){
  body=videoBody(p);
 }else if(S.tab==='sim'){
  const sm=DB.sims[s];
  body=`<h3 style="margin-top:0">${esc(sm.title)}</h3><p><b>Petunjuk:</b> ${esc(sm.instruction)}</p>`+sm.items.map((it,i)=>{
   const cls=S.simRes?(S.simAns[i]===it[1]?'good':'bad'):'';
   return `<div class="opt blk ${cls}"><div>${esc(it[0])}</div><select ${S.simRes?'disabled':''} onchange="simAns(${i},this.value)"><option value="">— pilih kategori —</option>${sm.categories.map((c,j)=>`<option value="${j}" ${S.simAns[i]===j?'selected':''}>${esc(c)}</option>`).join('')}</select>${S.simRes?`<small>${S.simAns[i]===it[1]?'✔ Tepat!':'✘ Jawaban tepat: '+esc(sm.categories[it[1]])}</small>`:''}</div>`}).join('')+
   (S.simRes?`<div class="card"><b>Skor simulasi: ${S.simRes.score}</b> (${S.simRes.ok}/${sm.items.length} tepat). Hasil tersimpan. Lanjutkan ke Asesmen.<p><button class="btn sec sm" onclick="setTab('sim')">Coba lagi</button></p></div>`
   :`<button class="btn" ${Object.keys(S.simAns).filter(k=>S.simAns[k]!==undefined).length<sm.items.length?'disabled':''} onclick="simSubmit()">Kirim Simulasi</button>`);
 }else if(S.tab==='asesmen'){
  if(S.result){const r=S.result;body=`<h3 style="margin-top:0">Hasil Asesmen – Percobaan ke-${r.no}</h3><p style="font-size:2rem;margin:0"><b>${r.score}</b> <span class="tag ${r.status==='TUNTAS'?'ok':'no'}">${r.status}</span></p><p>KKM ${KKM}. ${r.status==='TUNTAS'?'🎉 Selamat! Subbab berikutnya terbuka di dashboard.':'Pelajari kembali materi lalu ulangi. Nilai percobaan pertama tetap tersimpan.'} Pembahasan ada di tab Hasil.</p><button class="btn" onclick="S.result=null;startQuiz()">Ulangi Asesmen</button> <button class="btn sec" onclick="S.sub=null;render()">Ke Dashboard</button>`}
  else if(!S.quiz)body=`<p>Asesmen terdiri dari soal mudah, sedang, dan sulit (HOTS). Nilai minimal tuntas <b>${KKM}</b>. Kamu boleh mengulang.</p><button class="btn" onclick="startQuiz()">Mulai Asesmen</button>`;
  else body=S.quiz.qs.map((q,i)=>vQ(q,i)).join('')+`<p><small>Terjawab ${S.quiz.qs.filter(q=>{const a=S.quiz.ans[q.id];return Array.isArray(a)?a.length:a&&(typeof a!=='object'||Object.values(a).some(x=>x!==undefined))}).length}/${S.quiz.qs.length}</small></p><button class="btn" onclick="submitQuiz()">Kirim Jawaban</button>`;
 }else{

  body=!a.length?'<p>Belum ada percobaan asesmen.</p>':`<div class="grid"><div class="card">Nilai pertama<br><b style="font-size:1.6rem">${a[0].score}</b></div><div class="card">Nilai terakhir<br><b style="font-size:1.6rem">${a[a.length-1].score}</b></div><div class="card">Nilai tertinggi<br><b style="font-size:1.6rem">${Math.max(...a.map(x=>x.score))}</b></div><div class="card">Jumlah percobaan<br><b style="font-size:1.6rem">${a.length}</b></div></div>`+
   a.map(r=>`<div class="card"><b>Percobaan ${r.no}</b> · ${fmt(r.t)} · <b>${r.score}</b> <span class="tag ${r.status==='TUNTAS'?'ok':'no'}">${r.status}</span><details><summary>Pembahasan</summary>${r.graded.map((g,i)=>`<div class="opt blk ${g.fraction>=1?'good':g.fraction>0?'':'bad'}"><b>${i+1}. ${esc(g.prompt)}</b><br>${g.fraction>=1?'✔ Benar':g.fraction>0?'◐ Sebagian benar':'✘ Kurang tepat'} – ${g.points.toFixed(2)} dari bobot ${g.weight}<pre>Jawabanmu: ${esc(JSON.stringify(g.given))}\nKunci: ${esc(JSON.stringify(g.key))}</pre></div>`).join('')}</details></div>`).join('');

function vQ(q,i){
 const A=S.quiz.ans[q.id];let b='';
 if(q.type==='pg')b=q.options.map(o=>`<label class="opt"><input type="radio" ${A===o.id?'checked':''} onclick="aPg('${q.id}','${o.id}')">${esc(o.text)}</label>`).join('');
 if(q.type==='pgk')b='<small>Pilih lebih dari satu jawaban.</small>'+q.options.map(o=>`<label class="opt"><input type="checkbox" ${(A||[]).includes(o.id)?'checked':''} onclick="aPgk('${q.id}','${o.id}')">${esc(o.text)}</label>`).join('');
 if(q.type==='tf')b=q.options.map(o=>`<div class="opt blk"><div>${esc(o.text)}</div>${[[true,'Benar'],[false,'Salah']].map(([x,l])=>`<label style="display:inline-block;margin-right:14px;color:inherit;font-size:.95rem"><input type="radio" style="width:auto" ${(A||{})[o.id]===x?'checked':''} onclick="aMap('${q.id}','${o.id}','${x}')"> ${l}</label>`).join('')}</div>`).join('');
 if(q.type==='match'){const R=[...q.options.right].sort((a,b)=>a.text<b.text?-1:1);b=q.options.left.map(l=>`<div class="opt blk"><div>${esc(l.text)}</div><select onchange="aMap('${q.id}','${l.id}',this.value)"><option value="">— pasangkan —</option>${R.map(r=>`<option value="${r.id}" ${(A||{})[l.id]===r.id?'selected':''}>${esc(r.text)}</option>`).join('')}</select></div>`).join('')}
 return `<div class="card"><small>Soal ${i+1} dari ${S.quiz.qs.length}</small> <span class="tag wait">${LVL[q.difficulty]}</span>${q.stimulus?`<div class="stim">${esc(q.stimulus)}</div>`:''}<p><b>${esc(q.prompt)}</b></p>${b}</div>`;
}

function toText(q){
 if(q.type==='pg'||q.type==='pgk')return{opt:q.options.map(o=>o.text).join('\n'),key:[].concat(q.key).map(k=>q.options.findIndex(o=>o.id===k)+1).join(',')};
 if(q.type==='tf')return{opt:q.options.map(o=>o.text+' | '+(q.key[o.id]?'B':'S')).join('\n'),key:''};
 return{opt:q.options.left.map(l=>l.text+' = '+q.options.right.find(r=>r.id===q.key[l.id]).text).join('\n'),key:''};
}
function fromText(type,opt,key){
 const L=opt.split('\n').map(x=>x.trim()).filter(Boolean);
 if(type==='pg'||type==='pgk'){
  if(L.length<2)throw new Error('Minimal 2 pilihan (satu per baris)');
  const options=L.map((t,i)=>({id:'abcdefgh'[i],text:t})),ks=key.split(',').map(x=>parseInt(x)).filter(n=>n>=1&&n<=L.length);
  if(!ks.length)throw new Error('Isi nomor kunci, mis. 2 atau 1,3');
  if(type==='pg'&&ks.length!==1)throw new Error('Pilihan ganda hanya satu kunci');
  return{options,key:type==='pg'?options[ks[0]-1].id:ks.map(n=>options[n-1].id)};
 }
 if(type==='tf'){
  if(!L.length)throw new Error('Isi pernyataan: "teks | B" atau "teks | S"');
  const options=[],k={};L.forEach((l,i)=>{const [t,a]=l.split('|').map(x=>x.trim());if(!t||!/^[BS]$/i.test(a||''))throw new Error('Format baris '+(i+1)+': teks | B atau teks | S');options.push({id:'s'+(i+1),text:t});k['s'+(i+1)]=/^B$/i.test(a)});
  return{options,key:k};
 }
 if(L.length<2)throw new Error('Minimal 2 pasangan: "kiri = kanan"');
 const left=[],right=[],k={};L.forEach((l,i)=>{const [a,b]=l.split('=').map(x=>x.trim());if(!a||!b)throw new Error('Format baris '+(i+1)+': kiri = kanan');left.push({id:'l'+(i+1),text:a});right.push({id:'r'+(i+1),text:b});k['l'+(i+1)]='r'+(i+1)});
 return{options:{left,right},key:k};
}

 const qs=DB.questions.filter(q=>q.sub===S.qsub),tw=qs.filter(q=>q.active).reduce((a,q)=>a+q.weight,0),f=S.edit;
 let form='';
 if(f){const t=f.id?toText(f):{opt:'',key:''};
  form=`<div class="card" style="border-color:#4f46e5"><h3 style="margin-top:0">${f.id?'Edit soal':'Soal baru'}</h3><div class="grid"><div><label>Bentuk soal</label><select id="fq_type">${Object.keys(TYPE).map(k=>`<option value="${k}" ${f.type===k?'selected':''}>${TYPE[k]}</option>`).join('')}</select></div><div><label>Tingkat kesulitan</label><select id="fq_lvl">${Object.keys(LVL).map(k=>`<option value="${k}" ${f.difficulty===k?'selected':''}>${LVL[k]}</option>`).join('')}</select></div><div><label>Bobot</label><input id="fq_w" type="number" min="0.1" step="0.5" value="${f.weight}"></div></div>
  <label>Stimulus / kasus (opsional)</label><textarea id="fq_st">${esc(f.stimulus)}</textarea><label>Pertanyaan</label><textarea id="fq_p">${esc(f.prompt)}</textarea>
  <label>Pilihan / pernyataan / pasangan (satu per baris)</label><textarea id="fq_o" style="min-height:120px">${esc(t.opt)}</textarea><label>Nomor kunci (khusus pilihan ganda: mis. 2, atau 1,3 untuk kompleks)</label><input id="fq_k" value="${esc(t.key)}">
  <small>• Pilihan ganda/kompleks: tulis tiap pilihan per baris, kunci = nomor baris.<br>• Benar–Salah: <i>pernyataan | B</i> atau <i>pernyataan | S</i>.<br>• Mencocokkan: <i>kiri = kanan</i> (pasangan yang benar; urutan kanan diacak otomatis di soal).</small>
  <label><input type="checkbox" id="fq_a" style="width:auto" ${f.active?'checked':''}> Soal aktif</label><p><button class="btn" onclick="saveQ()">Simpan</button> <button class="btn sec" onclick="S.edit=null;render()">Batal</button></p></div>`}
 return `<div class="tabs g">${SUBS.map(s=>`<button class="${S.qsub===s?'on':''}" onclick="S.qsub='${s}';S.edit=null;render()">Subbab ${s}</button>`).join('')}</div><p>Soal aktif: ${qs.filter(q=>q.active).length} · total bobot aktif: ${tw}. Nilai = bobot diperoleh ÷ total bobot × 100. KKM ${KKM}.</p><p><button class="btn" onclick="S.edit={id:null,type:'pg',difficulty:'mudah',stimulus:'',prompt:'',weight:1,active:true};render()">+ Tambah soal</button></p>${form}`+
 tbl(['Bentuk','Level','Bobot','Soal','Aktif','Aksi'],qs.map(q=>`<tr style="opacity:${q.active?1:.5}"><td>${TYPE[q.type]}</td><td>${LVL[q.difficulty]}</td><td>${q.weight}</td><td>${q.stimulus?'<small>[Stimulus] </small>':''}${esc(q.prompt)}</td><td><button class="btn sec sm" onclick="tgQ('${q.id}')">${q.active?'Ya':'Tidak'}</button></td><td><button class="btn sec sm" onclick="S.edit=DB.questions.find(x=>x.id==='${q.id}');render()">Edit</button> <button class="btn red sm" onclick="delQ('${q.id}')">Hapus</button></td></tr>`));
}
function saveQ(){

  const type=v('fq_type'),prompt=v('fq_p').trim(),w=parseFloat(v('fq_w'));
  if(!prompt)throw new Error('Pertanyaan wajib diisi');if(!(w>0))throw new Error('Bobot harus > 0');
  const {options,key}=fromText(type,v('fq_o'),v('fq_k'));
  const rec={sub:S.qsub,type,difficulty:v('fq_lvl'),stimulus:v('fq_st').trim(),prompt,options,key,weight:w,active:document.getElementById('fq_a').checked};
  if(S.edit.id)Object.assign(DB.questions.find(x=>x.id===S.edit.id),rec);else DB.questions.push({id:uid(),...rec});

function vCal(){
 const now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+(S.calM||0),1),y=m.getFullYear(),mo=m.getMonth(),first=m.getDay(),dim=new Date(y,mo+1,0).getDate(),pd=new Date(y,mo,0).getDate();
 const t=S.user.role==='teacher',act=new Set(DB.logs.filter(l=>t||l.uid===S.user.id).map(l=>dkey(new Date(l.t))));
 let cells='';
 for(let i=0;i<42;i++){const d=i-first+1;let cls='',n=d,dt;
  if(d<1){n=pd+d;cls='o';dt=new Date(y,mo-1,n)}else if(d>dim){n=d-dim;cls='o';dt=new Date(y,mo+1,n)}else dt=new Date(y,mo,d);
  const k=dkey(dt);if(dkey(now)===k)cls+=' td';else if(act.has(k)&&!cls)cls+=' ac';
  cells+=`<span class="${cls}">${n}</span>`}
 return `<div class="cal"><div class="ch"><button onclick="calNav(-1)" aria-label="Bulan sebelumnya">‹</button><b>${MON[mo]} ${y}</b><button onclick="calNav(1)" aria-label="Bulan berikutnya">›</button></div><div class="cg">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<span class="w" style="height:auto;line-height:1.6">${x}</span>`).join('')}${cells}</div><small style="display:block;margin-top:8px">Garis bawah = ada aktivitas belajar</small></div>`;
}

/* ===================== KELOLA AKUN SISWA (GURU) ===================== */
const PWCH='abcdefghjkmnpqrstuvwxyz23456789';
const rndPw=()=>Array.from({length:6},()=>PWCH[Math.floor(Math.random()*PWCH.length)]).join('');
function mkUser(name){
 const base=name.trim().split(/\s+/)[0].toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'')||'siswa';
 let un=base,i=1;while(DB.users.some(u=>u.username===un)){i++;un=base+i}return un;
}
function fillGen(){const n=v('as_n');if(!v('as_u'))document.getElementById('as_u').value=n.trim()?mkUser(n):'';document.getElementById('as_p').value=rndPw()}
function addStu(){
 const name=v('as_n').trim(),cls=v('as_c').trim(),un=(v('as_u').trim()||(name?mkUser(name):'')).toLowerCase(),pw=v('as_p')||rndPw();
 if(!name)return alert('Nama siswa wajib diisi');
 if(!/^[a-z0-9._-]{3,}$/.test(un))return alert('Username minimal 3 karakter: huruf kecil, angka, titik, strip, atau garis bawah');
 if(DB.users.some(u=>u.username===un))return alert('Username "'+un+'" sudah dipakai, pilih yang lain');
 if(pw.length<4)return alert('Kata sandi minimal 4 karakter');
 DB.users.push({id:uid(),username:un,name,cls,role:'student',pass:pw});save();
 S.msg=`✅ Siswa ditambahkan — username: ${un} · kata sandi: ${pw}`;render();
}
function bulkStu(){
 const L=v('as_bulk').split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return alert('Tempel daftar siswa dahulu');
 let ok=0,skip=[];
 L.forEach(line=>{
  const [name,cls='',un0='',pw0='']=line.split(/\t|,|;/).map(x=>x.trim());
  if(!name)return;
  let un=(un0||mkUser(name)).toLowerCase(),pw=pw0||rndPw();
  if(!/^[a-z0-9._-]{3,}$/.test(un)||DB.users.some(u=>u.username===un)||pw.length<4){skip.push(name);return}
  DB.users.push({id:uid(),username:un,name,cls,role:'student',pass:pw});ok++;
 });
 save();S.msg=`✅ ${ok} siswa ditambahkan.`+(skip.length?` ⚠ Dilewati (username bentrok/tidak valid): ${skip.join(', ')}`:'')+' Daftar akun ada di tabel di bawah.';render();
}
function editStu(id){
 const u=DB.users.find(x=>x.id===id);
 const n=prompt('Nama lengkap:',u.name);if(n===null)return;
 const c=prompt('Kelas:',u.cls);if(c===null)return;
 const un=(prompt('Username:',u.username)||'').trim().toLowerCase();
 if(!/^[a-z0-9._-]{3,}$/.test(un))return alert('Username tidak valid');
 if(DB.users.some(x=>x.username===un&&x.id!==id))return alert('Username sudah dipakai');
 u.name=n.trim()||u.name;u.cls=c.trim();u.username=un;save();S.msg='✅ Data siswa diperbarui';render();
}
function resetPass(id){
 const u=DB.users.find(x=>x.id===id);
 const p=prompt('Kata sandi baru untuk '+u.name+' (min. 4 karakter).\nBiarkan isi saran acak ini atau ketik sendiri:',rndPw());
 if(p===null)return;if(p.length<4)return alert('Minimal 4 karakter');
 u.pass=p;save();S.msg=`✅ Kata sandi ${u.name} diubah menjadi: ${p}`;render();
}
function delStu(id){
 const u=DB.users.find(x=>x.id===id);
 if(DB.attempts.some(a=>a.uid===id)||DB.logs.some(l=>l.uid===id))return alert('Siswa ini sudah punya riwayat nilai/aktivitas, yang bersifat permanen. Akun tidak dapat dihapus. Ubah kata sandinya bila perlu menutup akses.');
 if(!confirm('Hapus akun '+u.name+'?'))return;
 DB.users=DB.users.filter(x=>x.id!==id);delete DB.progress[id];save();S.msg='✅ Akun dihapus';render();
}
function akunRows(){return students().map(u=>({nama:u.name,kelas:u.cls,username:u.username,kata_sandi:u.pass}))}
function printAkun(){
 const w=window.open('','_blank');if(!w)return alert('Izinkan pop-up untuk mencetak');
 w.document.write('<title>Daftar Akun Siswa</title><style>body{font-family:sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px 10px;text-align:left}</style><h2>Daftar Akun Siswa – IPS VIII Tema 02</h2><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Username</th><th>Kata sandi</th></tr>'+students().map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${esc(u.cls)}</td><td>${esc(u.username)}</td><td>${esc(u.pass)}</td></tr>`).join('')+'</table>');
 w.document.close();w.print();
}
function vSiswa(){
 const st=students();
 return `<div class="card" style="border-color:#cfcaf8"><h3 style="margin-top:0">➕ Tambah Siswa</h3>
 <div class="grid"><div><label>Nama lengkap</label><input id="as_n" placeholder="mis. Ani Lestari"></div><div><label>Kelas</label><input id="as_c" placeholder="VIII-A"></div>
 <div><label>Username (kosongkan = otomatis)</label><input id="as_u" autocapitalize="none" placeholder="mis. ani"></div><div><label>Kata sandi (kosongkan = acak)</label><input id="as_p" placeholder="min. 4 karakter"></div></div>
 <p><button class="btn sec" onclick="fillGen()">🎲 Buatkan username & sandi</button> <button class="btn" onclick="addStu()">Tambah siswa</button></p>
 <details><summary>Tambah banyak siswa sekaligus</summary><p class="mut" style="margin:8px 0">Satu siswa per baris, format: <b>Nama, Kelas, username, sandi</b>. Username dan sandi boleh dikosongkan (dibuat otomatis). Bisa ditempel langsung dari Excel.</p>
 <textarea id="as_bulk" placeholder="Ani Lestari, VIII-A&#10;Budi Santoso, VIII-A, budi.s, rahasia1&#10;Citra Dewi, VIII-B"></textarea><p><button class="btn" onclick="bulkStu()">Tambahkan semua</button></p></details></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3 style="margin:0">Daftar Akun Siswa (${st.length})</h3><div style="display:flex;gap:8px"><button class="btn sec sm" onclick="csv(akunRows(),'daftar_akun_siswa.csv')">⬇ CSV</button><button class="btn sec sm" onclick="printAkun()">🖨 Cetak</button></div></div>
 <p class="mut" style="margin:6px 0 10px">Username dan kata sandi ditampilkan di sini agar Bapak/Ibu dapat membagikannya ke siswa.</p>`+
 (st.length?tbl(['No','Nama','Kelas','Username','Kata sandi','Aksi'],st.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${esc(u.cls)}</td><td><b>${esc(u.username)}</b></td><td><code>${esc(u.pass)}</code></td><td><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:240px"><button class="btn sec sm" onclick="editStu('${u.id}')">Ubah</button><button class="btn sec sm" onclick="resetPass('${u.id}')">Sandi baru</button><button class="btn red sm" onclick="delStu('${u.id}')">Hapus</button></div></td></tr>`)):'<p class="mut">Belum ada siswa. Tambahkan lewat formulir di atas.</p>')+'</div>';
}
</script>
</body>
